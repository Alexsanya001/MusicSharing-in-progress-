storage:
  provider: minio

  minio:
    endpoint: ${MINIO_HOST}:${MINIO_PORT}
    region: ${MINIO_REGION}
    access-key: ${MINIO_ADMIN}
    secret-key: ${MINIO_PASSWORD}
    bucket-name: ${MINIO_BUCKET}

  aws:
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}
    bucket-name: ${AWS_BUCKET}